name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Report backend configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        # Prints only whether the values are present, never the values.
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::Supabase configured: this build connects to the backend."
          else
            echo "::warning::Supabase secrets missing: this build shows the 'Not connected yet' screen."
          fi
          if [ -n "$ADMOB_APP_ID" ] && [ -n "$ADMOB_INTERSTITIAL_ID" ]; then
            echo "::notice::AdMob configured: the release build shows ads."
          else
            echo "::warning::AdMob secrets missing: the release build shows no ads (debug uses Google test ads)."
          fi

      - name: Unit tests, lint, debug APK and release AAB
        env:
          # Client-safe values only (project URL + anon/publishable key).
          # When these repository secrets are absent the app builds and shows
          # its "not connected" state instead of pretending to work.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest lintRelease assembleDebug bundleRelease

      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          if-no-files-found: ignore
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/lint-results-release.html
